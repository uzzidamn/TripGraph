version: "3.8"

services:
  neo4j:
    image: neo4j:5-community
    container_name: tripgraph-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser UI
      - "7687:7687"   # Bolt protocol (used by Python driver)
    environment:
      - NEO4J_AUTH=neo4j/tripgraph123
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tripgraph-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend   # Hot-reload: code changes reflect without rebuild

volumes:
  neo4j_data:
